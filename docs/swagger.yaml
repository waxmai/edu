info:
  contact: {}
  title: Edu Schedule System 接口文档
  version: v0.0.1
paths:
  /api/v1/admin:
    post:
      consumes:
      - application/json
      description: 新增数据
      parameters:
      - description: 请求参数
        in: body
        name: RequestBody
        required: true
        schema:
          $ref: '#/definitions/dto.AdminCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 新增数据
      tags:
      - Table.admin
  /api/v1/admin/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 ID 删除数据
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.genResultInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 根据 ID 删除数据
      tags:
      - Table.admin
    get:
      consumes:
      - application/json
      description: 根据 ID 获取数据
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 根据 ID 获取数据
      tags:
      - Table.admin
    put:
      consumes:
      - application/json
      description: 根据 ID 更新数据
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      - description: 请求参数
        in: body
        name: RequestBody
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.genResultInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 根据 ID 更新数据
      tags:
      - Table.admin
  /api/v1/admins:
    get:
      consumes:
      - application/json
      description: 获取列表数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AdminResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 获取列表数据
      tags:
      - Table.admin
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: 用于首次登录强制改密，也可用于当前登录用户主动修改密码。
      parameters:
      - description: 请求参数
        in: body
        name: RequestBody
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用 sys_user 用户表进行正式登录，签发 JWT。
      parameters:
      - description: 请求参数
        in: body
        name: RequestBody
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/code.Failure'
      summary: 正式账号密码登录
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前 access token，并在提供 refresh token 时一并使其失效。
      parameters:
      - description: 可选 refresh token
        in: header
        name: X-Refresh-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 当前用户登出
      tags:
      - Auth
  /api/v1/auth/logout-all:
    post:
      consumes:
      - application/json
      description: 撤销当前用户的全部会话，包含当前 access token 对应会话。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 注销全部其他会话
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: 返回当前会话对应的用户信息。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/code.Failure'
      security:
      - BearerAuth: []
      summary: 获取当前登录用户信息
      tags:
      - Auth
  /api/v1/auth/password-recovery/reset:
    post:
      consumes:
      - application/json
      description: 校验恢复挑战后重置密码，并撤销历史会话。
      parameters:
      - description: 请求参数
        in: body
        name: RequestBody
        required: true
        schema:
          $ref: '#/definitions/auth.PasswordRecoveryResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PasswordRecoveryResetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/code.Failure'
        "403":
          description: Forbidden
          schema:
